name: Publish NuGet Packages

# 使用 nuget.org 的 Trusted Publishing（OIDC 免密钥发布），不再需要长期 API Key
# 前置条件（一次性，需用户在 nuget.org 配置）：
#   1. 登录 nuget.org → 用户名菜单 → “受信任的发布” → 新增策略
#      策略填写：仓库所有者 = QuickProtocol，仓库 = QuickProtocol_CSharp，工作流文件 = publish-nuget.yml
#   2. 仓库 Settings → Secrets 添加 NUGET_USER（你的 nuget.org 用户名，注意是 profile 名而非邮箱）

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build and publish to nuget.org (Trusted Publishing)
    runs-on: ubuntu-latest
    # id-token: write 是 OIDC 换取临时密钥所必需的权限
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build solution
        run: dotnet build -c Release

      - name: Pack packages
        run: |
          # 从 tag 推导版本号（去掉前缀 v），覆盖 csproj 中固定的 Version
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing version: $VERSION"
          for proj in \
            Quick.Protocol/Quick.Protocol.csproj \
            Quick.Protocol.Tcp/Quick.Protocol.Tcp.csproj \
            Quick.Protocol.SerialPort/Quick.Protocol.SerialPort.csproj \
            Quick.Protocol.Pipeline/Quick.Protocol.Pipeline.csproj \
            Quick.Protocol.WebSocket.Client/Quick.Protocol.WebSocket.Client.csproj \
            Quick.Protocol.WebSocket.Server.AspNetCore/Quick.Protocol.WebSocket.Server.AspNetCore.csproj \
            Quick.Protocol.Http.Client/Quick.Protocol.Http.Client.csproj \
            Quick.Protocol.Http.Server.AspNetCore/Quick.Protocol.Http.Server.AspNetCore.csproj \
            Quick.Protocol.InterfaceService/Quick.Protocol.InterfaceService.csproj
          do
            dotnet pack "$proj" -c Release -p:Version="$VERSION" -o ./artifacts
          done

      - name: NuGet login (OIDC → short-lived API key)
        id: login
        uses: NuGet/login@v1
        with:
          # 你的 nuget.org 用户名（profile 名，不是登录邮箱），建议放在仓库 Secret 中
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          shopt -s nullglob
          pkgs=( ./artifacts/*.nupkg )
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "::error::No .nupkg found in ./artifacts, aborting."
            exit 1
          fi
          for pkg in "${pkgs[@]}"; do
            echo "Pushing $pkg"
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
